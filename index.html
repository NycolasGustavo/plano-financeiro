<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Plano Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: livro-caixa de trabalho — trilho à esquerda, régua de mês/titular fixa no topo, painéis.
   Visual inspirado no Claude: papel creme, tinta quase preta, acento argila, títulos em serifa, interface em sans. */
:root{
  --bg:#F5F4ED; --surface:#FAF9F5; --sunken:#EDEBE2; --ink:#141413; --muted:#6B6A64; --line:#E3E0D5;
  --accent:#C96442; --accent-soft:#F4E4DB; --on-accent:#FFFFFF;
  --pos:#3F7A4E; --pos-soft:#E3EEDF; --neg:#B3321F; --neg-soft:#F6DED7; --warn:#8A6418; --warn-soft:#F3E9D2;
  --f-display:"Source Serif 4","Tiempos Text",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,20,19,.05),0 4px 14px rgba(20,20,19,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302E; --sunken:#1F1E1D; --ink:#FAF9F5; --muted:#A6A39A; --line:#3E3D39;
  --accent:#D97757; --accent-soft:#4A3229; --on-accent:#1F1E1D;
  --pos:#7FB98C; --pos-soft:#29362C; --neg:#EE8B78; --neg-soft:#45291F; --warn:#DDB264; --warn-soft:#3C3220;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --sunken:#1F1E1D; --ink:#FAF9F5; --muted:#A6A39A; --line:#3E3D39;
  --accent:#D97757; --accent-soft:#4A3229; --on-accent:#1F1E1D;
  --pos:#7FB98C; --pos-soft:#29362C; --neg:#EE8B78; --neg-soft:#45291F; --warn:#DDB264; --warn-soft:#3C3220;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:15px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:500;font-size:19px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-family:var(--f-num);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--sunken);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav-btn svg{width:16px;height:16px;flex:none}
.rail .spacer{flex:1}
.rail .status{font-size:12px;color:var(--muted);padding:8px 10px}

.main{min-width:0;padding-inline:28px;padding-block:0 96px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:26px;min-width:190px;text-align:center;text-transform:capitalize}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--muted)}
.seg{display:inline-flex;background:var(--sunken);border-radius:7px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--neg)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.matrix tr.saldo td{background:var(--sunken)}
.matrix tr.saldo td:first-child{white-space:normal}
.matrix tr.saldo.fim td{font-weight:600;border-top:2px solid var(--line)}
.matrix tr.saldo.ini td{font-weight:600}
.cp-fontes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cp-fonte{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;color:var(--ink);font:inherit}
.cp-fonte.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cp-fonte .v{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.cp-fonte small{font-size:11.5px}
.cp-grp{border-top:1px solid var(--line);padding:6px 0}
.cp-grp-h{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.cp-it{display:grid;grid-template-columns:minmax(0,1fr) 76px 92px;gap:10px;align-items:center;padding:5px 0}
.cp-it.off .cp-chk b{color:var(--muted);font-weight:400}
.cp-chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.cp-chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.cp-chk span{display:flex;flex-direction:column;min-width:0}.cp-chk b{font-weight:500}.cp-chk small{font-size:11.5px}
.cp-q{width:76px;padding:5px 8px}.cp-v{text-align:right;font-size:13px}
.cp-tirar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cp-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:12px -18px -18px;padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r);z-index:2}
.cp-bar div{display:flex;flex-direction:column}.cp-bar b{font-size:17px}
@media (max-width:760px){.cp-fontes{grid-template-columns:1fr}.cp-it{grid-template-columns:minmax(0,1fr) 64px 78px}.cp-q{width:64px}.cp-bar{gap:4px 14px;bottom:76px;padding:10px 14px;margin:12px -18px -18px;box-shadow:0 -6px 16px rgba(0,0,0,.06)}.cp-bar .eyebrow{font-size:10px}.cp-bar b{font-size:15px}.cp-bar .lbl-long{display:none}.cp-bar>span{margin-left:0!important;width:100%;flex-wrap:nowrap!important}.cp-bar>span .btn{flex:1;padding:6px 10px}}
/* placar de caixa */
.placar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.placar .pl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px 4px}
.placar .pl-head h3{margin:0}
.pl-row{display:flex;align-items:stretch;padding:8px 10px 12px;gap:2px}
.pl-row + .pl-row{border-top:1px dashed var(--line);padding-top:12px}
.pl-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center}
.pl-c{flex:1 1 0;min-width:0;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column;gap:3px}
.pl-c .v{font-family:var(--f-display);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.pl-c .s{font-size:11.5px;color:var(--muted)}
.pl-c.tot{background:var(--sunken)}
.pl-c.hoje{background:var(--accent-soft)} .pl-c.hoje .eyebrow{color:var(--accent)}
.pl-op{align-self:center;flex:0 0 22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--bg)}
.pl-foot{padding:10px 18px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.pl-foot .meter{width:120px;margin:0}
@media (max-width:860px){.pl-row{flex-wrap:wrap}.pl-c{flex:1 1 40%}.pl-op{display:none}.pl-lbl{writing-mode:horizontal-tb;transform:none;flex:1 0 100%;text-align:left;padding:0 10px}}
.kpi-hoje{background:var(--accent-soft)}
.kpi-hoje .eyebrow{color:var(--accent)}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--accent)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
.alert.ok{background:var(--pos-soft);color:var(--pos)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-num)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.prev{background:var(--warn-soft);color:var(--warn)}
.chip.imp{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.warn{color:var(--warn)}
.div-tg{border:0;background:none;color:var(--muted);cursor:pointer;width:20px;padding:0;font-size:13px;margin-right:2px}
.div-tg-sp{display:inline-block;width:22px}
.div-obs{display:block;max-width:420px;margin-left:22px}
tr.div-grp td{background:var(--sunken);font-weight:600;font-size:12.5px;letter-spacing:.02em}
tr.div-det>td{padding-top:0;background:var(--sunken)}
table.div-sub{width:100%;font-size:13px;margin:4px 0 10px}
table.div-sub th{font-size:11.5px}
.div-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.show-sm{display:none}
@media (max-width:700px){.div-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .div-tbl .hide-sm,.div-sub .hide-sm{display:none} .div-tbl .show-sm,.div-sub .show-sm{display:block;margin-top:2px} .div-sub .btn .show-sm{margin:0} .div-tbl,.div-sub{min-width:0!important;width:100%} .div-tbl td,.div-sub td{word-break:break-word} .div-obs{margin-left:0} table.div-sub{font-size:12.5px}}

.gbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.gbar .track{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.gbar .track b{display:block;height:100%;background:var(--accent);border-radius:4px}
.gbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunken)}
tr.is-prev td{color:var(--muted)}
tr.is-skip td{opacity:.45;text-decoration:line-through}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check.on{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.check svg{width:12px;height:12px}

/* Matriz do fluxo */
.matrix{font-size:13px}
.matrix td,.matrix th{padding:6px 10px;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:3;width:230px;min-width:230px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.matrix td.cur,.matrix th.cur{position:sticky;left:230px;z-index:2;box-shadow:inset -1px 0 0 var(--line),4px 0 8px -6px rgba(0,0,0,.25)}
.matrix th.cur{z-index:4}
.matrix tr.sec td{position:static}
.matrix tr.sec td:first-child{position:sticky}
.matrix tr.hoje td{color:var(--accent);font-weight:600}
@media (max-width:820px){.matrix th:first-child,.matrix td:first-child{width:150px;min-width:150px;max-width:150px}.matrix td.cur,.matrix th.cur{left:150px}}
.matrix tbody tr:hover td{background:var(--sunken)}
.matrix tr.sec td{background:var(--sunken);font-family:var(--f-display);font-weight:600;font-size:14px}
.matrix tr.grp td{font-weight:600;cursor:pointer}
.matrix tr.grp td:first-child::before{content:"▸";display:inline-block;width:12px;margin-right:6px;text-align:center;color:var(--muted);transition:transform .15s}
.matrix tr.grp.open td:first-child::before{transform:rotate(90deg)}
.matrix tr.cat td:first-child{padding-left:30px;color:var(--muted)}
.matrix tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.matrix td.fut{font-style:italic}
.matrix th.cur,.matrix td.cur{background:var(--accent-soft)!important}
.matrix td.cell{cursor:pointer}
.matrix td.cell:hover{text-decoration:underline}

.cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cardpick{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;min-width:140px;display:flex;flex-direction:column;gap:2px}
.cardpick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cardpick small{color:var(--muted);font-size:12px}
.jn-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.jn-lvl{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-num);font-size:24px;box-shadow:0 0 0 4px var(--accent-soft)}
.jn-info{display:flex;flex-direction:column;gap:6px;min-width:0}.jn-info .lim-meter{width:100%;align-self:stretch}
.jn-des{display:flex;flex-direction:column}.jn-d{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.jn-d:last-child{border-bottom:0}.jn-d>div{display:flex;flex-direction:column;gap:2px}.jn-d b{font-weight:500;font-size:13.5px}.jn-d small{color:var(--muted);font-size:12px}
.jn-streaks{display:flex;gap:10px}
.jn-st{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;min-width:78px;text-align:center}
.jn-st b{font-family:var(--f-num);font-size:20px}.jn-st small{font-size:11px;color:var(--muted);line-height:1.2}
.jn-ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.jn-ck.on{background:var(--pos);border-color:var(--pos)}.jn-ck svg{width:11px;height:11px}
.jn-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.jn-b{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;opacity:.75}
.jn-b.on{opacity:1;border-color:var(--warn);background:var(--warn-soft)}
.jn-b .jn-ic{color:var(--muted);flex:none;margin-top:1px}.jn-b.on .jn-ic{color:var(--warn)}
.jn-b>span{display:flex;flex-direction:column;gap:2px;min-width:0}.jn-b b{font-size:13px;font-weight:600}.jn-b small{font-size:11.5px;color:var(--muted)}
@media (max-width:700px){.jn-head{grid-template-columns:auto minmax(0,1fr)}.jn-streaks{grid-column:1/3;justify-content:space-between}.jn-st{flex:1;min-width:0}}
.teto-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin:8px 0}
.teto-row small{grid-column:2/4}
@media (max-width:700px){.teto-row{grid-template-columns:70px minmax(0,1fr)}.teto-row>span{grid-column:2}.teto-row small{grid-column:1/3}}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:20px}
.cx-card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:inherit;font:inherit}
.cx-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cx-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cx-v{font-size:22px;font-family:var(--f-num);margin:4px 0}
.cx-chart{width:100%;height:auto;display:block}
.cx-bar{fill:var(--accent);opacity:.35}.cx-bar.now{opacity:1}
.cx-meta{stroke:var(--ink);stroke-dasharray:4 4;stroke-width:1;opacity:.5}
.cx-lbl{font-size:13px;fill:var(--muted);font-family:var(--f-num)}
@media (max-width:700px){#cx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.forn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap}
.forn svg{flex:none;opacity:.8}
.lim-meter{position:relative;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:4px}
.lim-meter.alto{height:12px;border-radius:6px;margin-top:0;align-self:center}
.lim-meter i,.lim-meter b{position:absolute;left:0;top:0;bottom:0;display:block}
.lim-meter i{opacity:.3}
.fat-strip button.st-fechada em,.fat-strip button.st-aberta em{color:var(--ink)}

<script>
(() => {
'use strict';
/* ============ util ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fmt = v => BRL.format(Math.round((v || 0) * 100) / 100);
const fmtS = v => (v > 0 ? '+' : v < 0 ? '−' : '') + BRL.format(Math.abs(Math.round((v || 0) * 100) / 100));
const fmtK = v => { const a = Math.abs(v); const s = v < 0 ? '−' : ''; return a >= 1000 ? s + (a / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + 'k' : s + Math.round(a); };
const round2 = v => Math.round(v * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); const t = y * 12 + m - 1 + k; return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`; };
const ymDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const ymLong = ym => { const [y, m] = ym.split('-').map(Number); return `${MESES[m - 1]} ${y}`; };
const ymShort = ym => { const [y, m] = ym.split('-').map(Number); return `${MES3[m - 1]}/${String(y).slice(2)}`; };
const now = new Date();
const HOJE = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const HOJE_YM = HOJE.slice(0, 7);
const parseValor = s => { if (typeof s === 'number') return s; s = String(s || '').replace(/[R$\s]/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ICON = {
  painel:'<path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z"/>',
  lanc:'<path d="M4 5h12M4 10h12M4 15h8"/>',
  orcamento:'<path d="M4 16V9M8 16V5M12 16v-6M16 16V7"/><path d="M3 16.5h14"/>',
  controles:'<circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/><path d="M3 6h2M9 6h8M3 14h8M15 14h2"/>',
  compras:'<path d="M3 4h2l2 9h9l1.5-6.5H6"/><circle cx="8.5" cy="16.5" r="1"/><circle cx="14.5" cy="16.5" r="1"/>',
  fluxo:'<path d="M3 16l4-5 3 3 6-8"/><path d="M13 6h3v3"/>',
  fornecedores:'<path d="M3 8l1.5-4h11L17 8"/><path d="M3 8h14v1.5a2.3 2.3 0 0 1-4.6 0 2.3 2.3 0 0 1-4.7 0A2.3 2.3 0 0 1 3 9.5z"/><path d="M4.5 12v5h11v-5"/>',
  cartoes:'<rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="M2.5 8.5h15"/>',
  recs:'<path d="M15 7a6 6 0 1 0 1 5"/><path d="M16 3v4h-4"/>',
  dividas:'<path d="M4 16V8l6-4 6 4v8"/><path d="M8 16v-5h4v5"/>',
  caixinhas:'<path d="M4 8.5h12v7.5H4z"/><path d="M3 6h14v2.5H3z"/><path d="M10 6v10"/><path d="M10 6c-1-2.5-4-3-4-1s4 1 4 1zM10 6c1-2.5 4-3 4-1s-4 1-4 1z"/>',
  importar:'<path d="M10 3v10M6 9l4 4 4-4M4 16h12"/>',
  ajustes:'<circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/>',
};
const svgI = k => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';

/* ============ estado ============ */
const S = {
  db: null, downloads: null, config: null, configLoaded: false,
  lancByYear: {}, lanc: new Map(), recs: new Map(), divs: new Map(), planos: new Map(), ctrl: {}, pagamentos: new Map(), compraItens: new Map(), compraListas: new Map(), compras: new Map(), cxs: new Map(),
  view: 'painel', mes: HOJE_YM, tit: 'nycolas',
  filtro: {busca: '', tipo: '', status: '', cat: '', meio: '', nat: ''},
  cartaoSel: null, fatMes: null, openGroups: new Set(), imp: null, cache: null, readOnly: false,
};
try { const v = localStorage.getItem('pf.tit'); if (v) S.tit = v; const w = localStorage.getItem('pf.view'); if (w) S.view = w; } catch (e) {}

const DEFAULT_CONFIG = {
  titulares: [{id:'nycolas', nome:'Nycolas'}, {id:'grazi', nome:'Grazi'}],
  grupos: [{id:'renda',nome:'Renda',tipo:'entrada'},{id:'outras-entradas',nome:'Outras entradas',tipo:'entrada'},{id:'moradia',nome:'Moradia',tipo:'saida'},{id:'alimentacao',nome:'Alimentação',tipo:'saida'},{id:'transporte',nome:'Transporte',tipo:'saida'},{id:'saude',nome:'Saúde e bem-estar',tipo:'saida'},{id:'compras',nome:'Compras',tipo:'saida'},{id:'dividas',nome:'Dívidas e parcelamentos',tipo:'saida'},{id:'ajustes',nome:'Ajustes',tipo:'saida'}],
  categorias: [{id:'salario',nome:'Salário',grupo:'renda'},{id:'outros-nr',nome:'Outros não-recorrentes',grupo:'outras-entradas'},{id:'ajuste-in',nome:'Ajuste de caixa (+)',grupo:'outras-entradas'},{id:'aluguel',nome:'Aluguel',grupo:'moradia'},{id:'mercado',nome:'Mercado',grupo:'alimentacao'},{id:'transporte-pessoal',nome:'Transporte pessoal / apps',grupo:'transporte'},{id:'farmacia',nome:'Farmácia',grupo:'saude'},{id:'compras-diversas',nome:'Compras diversas',grupo:'compras'},{id:'emprestimos',nome:'Empréstimos',grupo:'dividas'},{id:'ajuste-out',nome:'Ajuste de caixa (−)',grupo:'ajustes'}],
  cartoes: [], saldoInicial: {nycolas:{competencia:HOJE_YM,valor:0}, grazi:{competencia:HOJE_YM,valor:0}},
  rendimentoRealMensal: 0, tetoReserva: {nycolas:0, grazi:0}, regras: [],
};

const C = () => S.config || DEFAULT_CONFIG;
const catById = id => C().categorias.find(c => c.id === id);
const grpById = id => C().grupos.find(g => g.id === id);
const catTipo = id => grpById(catById(id)?.grupo)?.tipo || 'saida';
const isFora = id => ['transferencia', 'ajuste'].includes(catTipo(id)); // fora do resultado: transferências e ajustes
const NATUREZAS = [['avulso', 'Avulso'], ['recorrente', 'Recorrente'], ['assinatura', 'Assinatura'], ['parcelado', 'Parcelado'], ['encargo', 'Encargo'], ['transferencia', 'Transferência'], ['ajuste', 'Ajuste']];
const natNome = n => (NATUREZAS.find(x => x[0] === n) || [, ''])[1];
const pessoas = () => C().titulares.filter(t => t.tipo !== 'pj');
const pjId = () => C().titulares.find(t => t.tipo === 'pj')?.id;
const outroTit = t => pessoas().find(x => x.id !== t)?.id;
const idsDe = tit => tit === 'casal' ? pessoas().map(t => t.id) : [tit];
const catNome = id => catById(id)?.nome || id || 'Sem categoria';
const cardById = id => C().cartoes.find(c => c.id === id);
const meioNome = m => m === 'conta' || !m ? 'Conta' : m === 'caixinha' ? 'Dentro da caixinha' : (cardById(m)?.nome || m);
const cxById = id => S.cxs.get(id);
const isCx = v => typeof v === 'string' && v.startsWith('cx:');
const ptNome = v => isCx(v) ? 'caixinha ' + (cxById(v.slice(3))?.nome || '') : titNome(v);
const titNome = t => t === 'casal' ? 'Casal' : (C().titulares.find(x => x.id === t)?.nome || t);
const ipca = () => Number(C().ipcaEstimado ?? 4.5);

/* ============ controles (energia, transporte, marmitas) ============ */
function ctrlTransporte(m) { const t = S.ctrl.transporte || {}; const dias = t.dias?.[m] ?? t.diasPadrao ?? 25; return {tarifa: Number(t.tarifa ?? 7.24), viagens: Number(t.viagensDia ?? 2), dias: Number(dias)}; }
function ctrlMarmitas(m, r) { const k = S.ctrl.marmitas || {}; return {preco: Number(k.preco ?? 9.99), qtd: Number(k.qtd?.[m] ?? r?.qtdPadrao ?? k.qtdPadrao ?? 49)}; }
// energia: cada leitura = uma conta (mês de referência). Paga no mês do vencimento (padrão: mês seguinte, dia 10).
const dIso = iso => iso ? iso.split('-').reverse().join('/') : '';
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
function energiaLeituras() {
  const ls = [...(S.ctrl.energia?.leituras || [])].sort((a, b) => a.competencia.localeCompare(b.competencia));
  let ant = null;
  return ls.map(l => {
    const kwh = l.consumo != null && l.consumo !== '' ? Number(l.consumo) : (ant?.medidor != null && l.medidor != null ? Number(l.medidor) - Number(ant.medidor) : null);
    const dataAnt = l.dataAnterior || ant?.dataLeitura || null;
    const dias = l.dias != null ? Number(l.dias) : (dataAnt && l.dataLeitura ? diasEntre(dataAnt, l.dataLeitura) : null);
    const cosip = l.cosip != null ? Number(l.cosip) : null, energia = Number(l.valor) - (cosip || 0);
    const venc = l.vencimento || `${ymAdd(l.competencia, 1)}-10`;
    const o = {...l, kwh, dataAnt, dias, cosip, energia, venc, pagaEm: venc.slice(0, 7), kwhDia: kwh && dias ? kwh / dias : null, tarifa: kwh ? energia / kwh : null};
    ant = l; return o; });
}
function energiaEstimativa() {
  const ls = energiaLeituras().filter(l => l.kwh && l.valor); if (!ls.length) return null;
  const ult = ls.slice(-3), u = ls[ls.length - 1];
  const comDias = ult.filter(l => l.dias);
  const kwhDia = comDias.length ? comDias.reduce((s, l) => s + l.kwh, 0) / comDias.reduce((s, l) => s + l.dias, 0) : null;
  const kwh = kwhDia ? kwhDia * 30 : ult.reduce((s, l) => s + l.kwh, 0) / ult.length;
  const cosip = [...ls].reverse().find(l => l.cosip != null)?.cosip || 0;
  const tarifa = u.cosip != null ? u.tarifa : (Number(u.valor) - cosip) / u.kwh;
  return {kwh, kwhDia, tarifa, cosip, valor: round2(kwh * tarifa + cosip), ate: u.pagaEm};
}
function controleValor(r, m) {
  if (r.controle === 'transporte') { const t = ctrlTransporte(m); return t.tarifa * t.viagens * t.dias; }
  if (r.controle === 'marmitas') { const k = ctrlMarmitas(m, r); return k.preco * k.qtd; }
  if (r.controle === 'energia') { const c = energiaLeituras().find(l => l.pagaEm === m); if (c) return Number(c.valor); const e = energiaEstimativa(); return e && m > e.ate ? e.valor : null; }
  return null;
}
function recValor(r, m) {
  if (r.pctDe) { const b = S.recs.get(r.pctDe); if (b) return round2(recValor(b, m) * (Number(r.pct) || 0) / 100); }
  let v = Number(r.valor) || 0;
  const rj = r.reajuste;
  if (rj && rj.mes) {
    const pct = rj.pct != null && rj.pct !== '' ? Number(rj.pct) : ipca();
    for (let y = Number(r.inicio.slice(0, 4)); y <= Number(m.slice(0, 4)); y++) { const ym = `${y}-${pad(rj.mes)}`; if (ym > r.inicio && ym <= m && (!rj.desde || y >= rj.desde)) v *= 1 + pct / 100; }
  }
  if (r.controle) { const cv = controleValor(r, m); if (cv != null) v = cv; }
  return round2(v);
}

/* ============ motor: itens do mês, saldos ============ */
function rebuild() {
  const all = new Map();
  for (const y in S.lancByYear) for (const [k, v] of S.lancByYear[y]) all.set(k, v);
  S.lanc = all; S.cache = null;
}
function engine() {
  if (S.cache) return S.cache;
  const byMonth = new Map(); // ym -> array
  const recLinks = new Set();
  const push = (ym, it) => { let a = byMonth.get(ym); if (!a) byMonth.set(ym, a = []); a.push(it); };
  for (const [id, l] of S.lanc) {
    if (!l || !l.competencia) continue;
    push(l.competencia, {...l, id});
    if (l.recorrencia) recLinks.add(l.recorrencia + '|' + l.competencia);
  }
  const months = [...byMonth.keys()].sort();
  const si = C().saldoInicial || {};
  let start = months[0] || HOJE_YM;
  for (const t in si) if (si[t]?.competencia && si[t].competencia < start) start = si[t].competencia;
  const end = ymAdd(S.mes > HOJE_YM ? S.mes : HOJE_YM, 24);
  for (const [rid, r] of S.recs) {
    if (!r || r.ativo === false) continue;
    let m = r.inicio < start ? start : r.inicio;
    const last = r.fim && r.fim < end ? r.fim : end;
    while (m <= last) {
      if (!recLinks.has(rid + '|' + m)) push(m, {id:'v:' + rid + ':' + m, virtual:true, recorrencia:rid, tipo:r.tipo, titular:r.titular, competencia:m, data:`${m}-${pad(Math.min(r.dia || 1, 28))}`, valor:recValor(r, m), descricao:r.descricao, categoria:r.categoria, meio:r.meio || 'conta', status:'previsto', fornecedor:r.fornecedor || '', natureza:r.natureza || 'recorrente', controle:r.controle || null, caixinha:r.caixinha || null, envelope:!!r.envelope});
      m = ymAdd(m, 1);
    }
  }
  // realizados sem vínculo consomem a previsão automática da mesma categoria, no mesmo meio de pagamento (evita contar duas vezes).
  // Nunca mexe num lançamento que você digitou ou editou: só em previsões de recorrência ou da planilha original.
  const consumivel = it => it.virtual ? !it.distrib : (it.origem === 'planilha' && !it.editado);
  for (const arr of byMonth.values()) {
    const pool = {};
    for (const it of arr) if (it.status === 'realizado' && !it.recorrencia && !it.par && !isFora(it.categoria) && !it.impulso) { const k = it.titular + '|' + it.categoria + '|' + it.tipo + '|' + (it.meio || 'conta'); pool[k] = (pool[k] || 0) + (Number(it.valor) || 0); }

const TIPO_CARTAO = {credito: 'Cartão de crédito', crediario: 'Crédito na loja', terceiro: 'Cartão de terceiro', beneficio: 'Benefício (VA/VR)'};

  const plano = {}; for (const [, d] of docs) if (d) for (const [c, v] of Object.entries(d.linhas || {})) plano[c] = round2((plano[c] || 0) + v);
  const fc = engine().faturaCaixa, real = {}, pend = {};

      <td class="r num muted">${num(pd)}</td><td class="r num">${num(pj)}</td><td class="r num ${ruim ? 'neg' : Math.abs(dif) > 0.004 ? 'pos' : 'muted'}">${Math.abs(dif) > 0.004 ? (dif > 0 ? '+' : '−') + fmt(Math.abs(dif)).replace('R$', '').trim() : '–'}</td></tr>`;

/* ============ limite de cartão ============ */
function fechamentoData(card, fat) { const f = pad(card.fechamento || 1); return (card.vencimento || 10) > (card.fechamento || 1) ? `${fat}-${f}` : `${ymAdd(fat, -1)}-${f}`; }
// 5º dia útil (CLT: conta sábado; não conta domingo nem feriado nacional)
function pascoa(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da, 12); }
function feriados(y) { const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; const p = pascoa(y), sx = new Date(p); sx.setDate(p.getDate() - 2); const cc = new Date(p); cc.setDate(p.getDate() + 60);
  return new Set(['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'].map(x => `${y}-${x}`).concat([iso(sx), iso(cc)])); }
function quintoDiaUtil(ym) { const [y, m] = ym.split('-').map(Number); const fer = feriados(y); let n = 0;
  for (let d = 1; d <= 31; d++) { const dt = new Date(y, m - 1, d, 12); if (dt.getMonth() !== m - 1) break; const iso = `${ym}-${pad(d)}`; if (dt.getDay() === 0 || fer.has(iso)) continue; if (++n === 5) return iso; } return `${ym}-07`; }
function vencData(card, F) { return card.descontoSalario ? quintoDiaUtil(F) : `${F}-${pad(Math.min(card.vencimento || 10, 28))}`; }
function fatDoPagamento(card, p) { if (p.fatura) return p.fatura; const [y, mo, d] = p.data.split('-').map(Number); let F = `${y}-${pad(mo)}`; if (!card.descontoSalario && d > (card.vencimento || 10)) F = ymAdd(F, 1); return F; }
// Limite: tudo que já foi cobrado e ainda não foi pago (fatura fechada em aberto + fatura aberta + parcelas futuras).
// "Projetado" soma os previstos que ainda vão cair na fatura aberta (assinaturas, recorrências).
function limiteCartao(card) {
  const E = engine(), fc = E.faturaCaixa, limite = Number(card.limite) || 0;
  const somaF = (F, st) => { let v = 0; for (const it of E.byMonth.get(F) || []) if (it.meio === card.id && it.status !== 'pulado' && (st ? it.status === st : true)) v += it.tipo === 'saida' ? it.valor : -it.valor; return round2(v); };
  if (card.tipo === 'beneficio') {
    const usado = somaF(HOJE_YM, 'realizado'), prev = somaF(HOJE_YM, 'previsto');
    return {beneficio: true, aberta: HOJE_YM, usado, limite, livre: round2(limite - usado), pct: limite ? usado / limite * 100 : 0, proj: round2(usado + prev), livreProj: round2(limite - usado - prev), pctProj: limite ? (usado + prev) / limite * 100 : 0, fechada: null, futuras: 0, desde: HOJE_YM + '-01'};
  }
  const aberta = competenciaCartao(card, HOJE), fechadaF = ymAdd(aberta, -1);
  const pg = F => round2(fc.paidFor[card.id + '|' + F] || 0);
  const fechada = {F: fechadaF, real: somaF(fechadaF, 'realizado'), pago: pg(fechadaF), venc: vencData(card, fechadaF), fechou: fechamentoData(card, fechadaF)};
  fechada.falta = card.descontoSalario && HOJE >= fechada.venc ? 0 : Math.max(0, round2(fechada.real - fechada.pago));
  fechada.descontada = !!(card.descontoSalario && HOJE >= fechada.venc);
  const ab = {F: aberta, real: somaF(aberta, 'realizado'), prev: somaF(aberta, 'previsto'), pago: pg(aberta), venc: vencData(card, aberta), fecha: fechamentoData(card, aberta)};
  ab.falta = Math.max(0, round2(ab.real - ab.pago));
  let futuras = 0, ult = aberta; for (const F of E.byMonth.keys()) if (F > aberta) { const r = somaF(F, 'realizado'); if (r > 0.004) { futuras += Math.max(0, r - pg(F)); if (F > ult) ult = F; } }

/* ============ fornecedores ============ */
function vFornecedores() {
  const N = S.fornPer || 6; const ms = []; for (let k = N - 1; k >= 0; k--) ms.push(ymAdd(S.mes, -k));
  const q = norm(S.fornBusca || ''); const natF = S.fornNat || '';

    if (it.tipo !== 'saida' || it.status === 'pulado' || isFora(it.categoria)) continue;
    if (!S.fornTodos && !it.fornecedor) continue;
    const key = it.fornecedor || it.descricao;
    let f = map.get(key); if (!f) map.set(key, f = {nome: key, sem: !it.fornecedor, total: 0, n: 0, porMes: {}, nats: {}, cats: {}, meios: {}, ultimo: '', prev: 0});

    porNat[nat] = (porNat[nat] || 0) + it.valor;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0]?.[0];
  let list = [...map.values()].map(f => { f.meses = Object.keys(f.porMes).length; f.nat = top(f.nats); f.cat = top(f.cats); f.media = f.total / N; f.habito = f.nat === 'avulso' && N >= 3 && f.meses >= Math.ceil(N * .6); return f; });
  list = list.filter(f => (!q || norm(f.nome).includes(q)) && (!natF || f.nat === natF || (natF === 'habito' && f.habito)));
  list.sort((a, b) => b.total - a.total);
  const tot = list.reduce((s, f) => s + f.total, 0);
  const mx = Math.max(1, ...list.flatMap(f => Object.values(f.porMes)));
  const k = (id, lbl) => `<div class="kpi"><span class="eyebrow">${lbl}</span><span class="v">${fmt((porNat[id] || 0) / N)}</span><span class="s">média por mês · ${fmt(porNat[id] || 0)} no período</span></div>`;
  const spark = f => `<svg class="spark" viewBox="0 0 ${N * 8} 22" width="${N * 8}" height="22" aria-hidden="true">${ms.map((m, i) => { const v = f.porMes[m] || 0; const h = v ? Math.max(2, v / Math.max(...Object.values(f.porMes)) * 20) : 1; return `<rect x="${i * 8 + 1}" y="${22 - h}" width="6" height="${h}" rx="1" fill="${v ? 'var(--accent)' : 'var(--line)'}"/>`; }).join('')}</svg>`;
  return `<div class="kpis" style="margin-bottom:18px">${k('assinatura', 'Assinaturas')}${k('recorrente', 'Contas recorrentes')}${k('parcelado', 'Parcelamentos')}${k('avulso', 'Gastos avulsos')}</div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Período">${[3, 6, 12].map(n => `<button data-act="fornPer" data-n="${n}" aria-pressed="${N === n}">${n} meses</button>`).join('')}</div>
      <input class="input" id="fo-busca" type="search" placeholder="Buscar fornecedor" value="${esc(S.fornBusca || '')}" data-fo="busca" style="flex:1;min-width:160px">

    </div>
    ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fornecedor</th><th>Natureza</th><th>Categoria</th><th>Meses</th><th class="r">Lanç.</th><th class="r">Total</th><th class="r">% do período</th><th class="r">Média/mês</th><th>Último</th></tr></thead><tbody>

  }

    const meta = its.reduce((a, i) => a + (i.status === 'previsto' ? (i.valorOriginal ?? i.valor) : 0), 0), real = its.filter(i => i.status === 'realizado').reduce((a, i) => a + i.valor, 0);

}

function openConciliar() {
  const tit = S.tit; const hojeM = S.mes === HOJE_YM; const r = resumoMes(S.mes, tit); const foraT = hojeM ? (C().guardadoFora || []).filter(g => idsDe(tit).includes(g.titular)).reduce((a, g) => a + (Number(g.valor) || 0), 0) : 0; const calc = hojeM ? round2(engine().hoje[tit] - foraT) : r.fim;
  $('#modal').innerHTML = `<div class="scrim" data-act="closeScrim"><form class="sheet center" id="conc-form">
    <div class="sheet-head"><h2>${hojeM ? 'Conferir saldo de hoje' : 'Conciliar ' + ymLong(S.mes)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">✕</button></div>
    <p class="muted" style="margin:0">${hojeM ? `Informe quanto ${esc(titNome(tit))} tem agora na conta do banco${foraT ? ` (sem contar os ${fmt(foraT)} guardados fora, que o app já soma)` : ''}. Se houver diferença, ela vira um ajuste de caixa com a data de hoje.` : `Informe quanto ${esc(titNome(tit))} tinha de fato no fim do mês. A diferença vira um ajuste de caixa.`}</p>
    <div class="hint">Saldo calculado pelo app ${hojeM ? 'hoje' : 'no fim do mês'}: <b class="num">${calc == null ? '—' : fmt(calc)}</b>${hojeM ? '<br>Antes de ajustar, confira se falta lançar algum débito ou Pix do extrato: a diferença costuma estar aí.' : ''}</div>
    <div class="field"><label for="cc-real">Saldo real</label><input class="amount" id="cc-real" inputmode="decimal" placeholder="0,00"></div>
    <div id="cc-dif" class="muted" style="font-size:13px"></div>
    <div class="sheet-foot"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Lançar ajuste</button></div></form></div>`;
  S.concCalc = calc; setTimeout(() => $('#cc-real')?.focus(), 30);
}
async function submitConciliar() {
  const real = parseValor($('#cc-real').value); const calc = S.concCalc; const hojeM = S.mes === HOJE_YM;
  if (isNaN(real) || calc == null) return toast('Informe o saldo real.');
  const dif = round2(real - calc); closeModal();
  if (Math.abs(dif) < 0.01) return toast('Saldo confere com o banco. Nenhum ajuste necessário.');
  const data = hojeM ? HOJE : `${S.mes}-${pad(Math.min(28, new Date(...S.mes.split('-').map(Number), 0).getDate()))}`;
  const ok = await put('lancamentos', 'aj-' + uid(), {tipo: dif > 0 ? 'entrada' : 'saida', titular: S.tit, competencia: S.mes, data, valor: Math.abs(dif), descricao: hojeM ? `Ajuste de caixa (conferência de ${data.split('-').reverse().join('/')})` : 'Ajuste de caixa (conciliação)', categoria: dif > 0 ? 'ajuste-in' : 'ajuste-out', meio: 'conta', status: 'realizado', origem: 'conciliacao', natureza: 'ajuste'});
  if (ok) toast(`Ajuste de ${fmtS(dif)} lançado.`);

/* ============ ações ============ */
async function toggle(id) {
  if (S.readOnly) return;
  const it = findItem(id); if (!it) return;
  if (it.distrib) return confirmaDistrib(it.competencia);
  if (it.virtual) return put('lancamentos', 'rx-' + uid(), limpaVirtual(it));
  const old = S.lanc.get(id);
  return put('lancamentos', id, {...old, status: old.status === 'realizado' ? 'previsto' : 'realizado'});
}
function limpaVirtual(it) { const {id, virtual, valorOriginal, consumido, controle, distrib, ...rest} = it; return {...rest, status: 'realizado', origem: 'recorrencia'}; }
async function confirmaDistrib(ym) {
  const E = engine().byMonth.get(ym) || []; const a = E.find(i => i.id === 'vd:pj:' + ym), b = E.find(i => i.id === 'vd:pf:' + ym); if (!a || !b) return;
  const id = 'ds-' + uid(); const clean = x => { const {id: _, virtual, distrib, valorOriginal, consumido, ...r} = x; return {...r, status: 'realizado', origem: 'distribuicao'}; };
  const ok = await putMany('lancamentos', [[id, {...clean(a), par: id + '-pf'}], [id + '-pf', {...clean(b), par: id}]]);
  if (ok) toast('Distribuição confirmada nos dois lados.');
}
async function confirmAll() {
  const cids = engine().faturaCaixa.cardIds, viaFat = S.mes >= HOJE_YM;
  const pend = itensMes(S.mes).filter(i => i.status === 'previsto' && i.valor > 0.004 && !(viaFat && cids.has(i.meio)));
  const entries = [], feitos = new Set();
  for (const it of pend) {
    if (it.distrib) { if (feitos.has(it.competencia)) continue; feitos.add(it.competencia); const E = engine().byMonth.get(it.competencia) || []; const pa = E.find(x => x.id === 'vd:pj:' + it.competencia), pb = E.find(x => x.id === 'vd:pf:' + it.competencia); const id = 'ds-' + uid(); const clean = x => { const {id: _, virtual, distrib, valorOriginal, consumido, ...r} = x; return {...r, status: 'realizado', origem: 'distribuicao'}; }; if (pa && pb) entries.push([id, {...clean(pa), par: id + '-pf'}], [id + '-pf', {...clean(pb), par: id}]); continue; }
    if (it.virtual) entries.push(['rx-' + uid(), limpaVirtual(it)]); else entries.push([it.id, {...S.lanc.get(it.id), status: 'realizado'}]);
  }
  const ok = await putMany('lancamentos', entries); if (ok) toast(`${pend.length} itens confirmados.`);
}
async function exportar() {
  const rows = [['competencia', 'data', 'titular', 'tipo', 'descricao', 'fornecedor', 'natureza', 'grupo', 'categoria', 'meio', 'status', 'parcela', 'valor']];
  const E = engine();
  for (const m of [...E.byMonth.keys()].sort()) for (const it of E.byMonth.get(m)) {
    if (it.status === 'pulado') continue;
    rows.push([m, it.data, titNome(it.titular), it.tipo, it.descricao, it.fornecedor || '', natNome(it.natureza) || '', grpById(catById(it.categoria)?.grupo)?.nome || '', catNome(it.categoria), meioNome(it.meio), it.virtual ? 'previsto (recorrência)' : it.status, it.parcela ? `${it.parcela.n}/${it.parcela.total}` : '', String(it.valor).replace('.', ',')]);
  }
  const csv = '\uFEFF' + rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  try { await S.downloads.save({filename: `lancamentos-${HOJE}.csv`, data: csv}); toast('Arquivo exportado.'); }
  catch (e) { if (e?.code !== 'declined') toast('Não foi possível exportar agora.'); }
}

    case 'saveProj': { const r = parseValor($('#cfg-rend').value), ip = parseValor($('#cfg-ipca').value), mt = parseValor($('#cfg-meta').value); const al = {}; ['pis', 'cofins', 'irpj', 'csll', 'iss'].forEach(k => { const v = parseValor($('#cfg-al-' + k).value); al[k] = isNaN(v) ? 0 : v; }); await saveConfig({rendimentoRealMensal: isNaN(r) ? 0 : r / 100, ipcaEstimado: isNaN(ip) ? 4.5 : ip, metaInvestimento: isNaN(mt) ? 20 : mt, pjAliquotas: al}); toast('Projeções salvas.'); break; }
    case 'export': exportar(); break;
    case 'fluxoAnt': S.fluxoAnt = !S.fluxoAnt; render(); break;
    case 'congelar': { const tits = idsDe(S.tit).filter(t => !S.planos.get(`${t}_${S.mes}`)); if (await congelar(S.mes, tits)) toast(`Plano de ${ymLong(S.mes)} congelado.`); break; }
    case 'pedeRecongelar': S.confirmaRecongelar = true; render(); break;
    case 'cancelaRecongelar': S.confirmaRecongelar = false; render(); break;
    case 'recongelar': S.confirmaRecongelar = false; if (await congelar(S.mes, idsDe(S.tit))) toast('Plano substituído pela projeção atual.'); break;
    case 'addPedido': {
      const q = Number($('#mp-qtd').value) || 0; if (!q) return toast('Informe quantas marmitas vieram no pedido.');
      const data = $('#mp-data').value || HOJE; const meio = $('#mp-meio').value; const k = ctrlMarmitas(data.slice(0, 7));
      const v = parseValor($('#mp-valor').value); const valor = round2(isNaN(v) ? q * k.preco : v); const card = cardById(meio);
      if (await put('lancamentos', 'mm-' + uid(), {tipo: 'saida', titular: 'nycolas', competencia: card ? competenciaCartao(card, data) : data.slice(0, 7), data, valor, qtd: q, descricao: `Pedido de marmitas (${q})`, fornecedor: 'Marmitas', natureza: 'recorrente', categoria: 'marmitas', meio, status: 'realizado', origem: 'controle'})) toast('Pedido registrado.');
      break; }
    case 'addLeitura': {
      const m = $('#en-mes').value; const v = parseValor($('#en-val').value); if (!m || isNaN(v)) return toast('Informe a referência e o total da conta.');
      const med = parseValor($('#en-med').value), kwh = parseValor($('#en-kwh').value), cosip = parseValor($('#en-cosip').value);
      const dAnt = $('#en-dant').value, dAt = $('#en-datu').value, venc = $('#en-venc').value;
      const old = (S.ctrl.energia?.leituras || []).find(l => l.competencia === m) || {};
      const ls = (S.ctrl.energia?.leituras || []).filter(l => l.competencia !== m);
      ls.push({...old, competencia: m, valor: round2(v), ...(isNaN(med) ? {} : {medidor: med}), ...(isNaN(kwh) ? {} : {consumo: kwh}), ...(isNaN(cosip) ? {} : {cosip: round2(cosip)}), ...(dAnt ? {dataAnterior: dAnt} : {}), ...(dAt ? {dataLeitura: dAt} : {}), ...(venc ? {vencimento: venc} : {})});
      await saveCtrl('energia', {leituras: ls}); toast('Conta salva.'); break; }
    case 'delLeitura': await saveCtrl('energia', {leituras: (S.ctrl.energia?.leituras || []).filter(l => l.competencia !== el.dataset.m)}); break;
    case 'addPag': { const v = parseValor($('#pg-valor').value); if (isNaN(v) || v <= 0) return toast('Informe o valor pago.'); if (await put('pagamentos', 'pg-' + uid(), {cartao: el.dataset.c, data: $('#pg-data').value || HOJE, valor: round2(v), origem: 'manual', ...($('#pg-fat')?.value ? {fatura: $('#pg-fat').value} : {})})) toast('Pagamento registrado.'); break; }
    case 'delPag': del('pagamentos', el.dataset.id); break;
    case 'cpFonte': S.cpFonte = el.dataset.id; render(); break;
    case 'cpNova': await cpNova(); break;
    case 'cpNota': openNota(el.dataset.id || null); break;
    case 'cpLer': cpLer(); break;
    case 'cpLerDeNovo': S.nota.parsed = null; S.nota.texto = ''; drawNota(); break;
    case 'cpRegistrar': await cpRegistrar(); break;
    case 'cpFecharValor': openValor(el.dataset.id); break;
    case 'cpDescartar': await del('compras', el.dataset.id); toast('Compra descartada.'); break;
    case 'cpTirar': { const ab = cpAberta(); if (ab) cpSet(ab[0], c => { (c.itens[el.dataset.id] ||= {}).vai = false; }); break; }
    case 'cpMarcar': { const ab = cpAberta(); if (ab) { const f = cpFonte(ab[1].fonte); cpSet(ab[0], c => { for (const i of cpItens()) (c.itens[i._id] ||= {qtd: i.qtdPadrao ?? 1}).vai = el.dataset.v === '1' && (!i.fonte || i.fonte === f.id); }); } break; }
    case 'cpCat': S.cpCatAberto = !S.cpCatAberto; render(); break;
    case 'cpDelItem': { const it = S.compraItens.get(el.dataset.id); if (it) put('compraItens', el.dataset.id, {...it, ativo: false}); break; }
    case 'cpAddItem': { const n = $('#cpn-nome').value.trim(); if (!n) return toast('Dê um nome ao produto.'); const pr = parseValor($('#cpn-preco').value); const id = 'ci-' + uid();
      const item = {nome: n, categoria: $('#cpn-cat').value, unidade: 'un', freq: 'eventual', qtdPadrao: 1, ativo: true, codigos: [], regra: '', ...(isNaN(pr) ? {} : {preco: round2(pr)})};
      S.compraItens.set(id, item); const ab = cpAberta(); if (ab) cpSet(ab[0], c => { c.itens[id] = {vai: true, qtd: 1}; }); await put('compraItens', id, item); break; }
    case 'fornPer': S.fornPer = Number(el.dataset.n); render(); break;
    case 'fornGo': S.filtro = {busca: el.dataset.f, tipo: '', status: '', cat: '', meio: '', nat: ''}; S.view = 'lanc'; render(); window.scrollTo(0, 0); break;
  }
});
$('#fab').addEventListener('click', () => openLanc(null));
document.addEventListener('input', e => {
  if (e.target.dataset?.cpbusca) { S.cpBusca = e.target.value; clearTimeout(S._cpb); S._cpb = setTimeout(() => { render(); const b = $('#cp-busca'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 250); return; }
  const t = e.target;
  if (t.id === 'cc-real') { const v = parseValor(t.value), d = $('#cc-dif'); if (d) d.textContent = isNaN(v) || S.concCalc == null ? '' : Math.abs(v - S.concCalc) < 0.01 ? 'Confere com o app.' : `Diferença: ${fmtS(v - S.concCalc)}`; return; }
  if (t.dataset.f && S.form) {
    const k = t.dataset.f; S.form[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'descricao' && !S.form.id) { // autocompletar pelo histórico
      const hits = [...S.lanc.values()].filter(l => l.tipo === S.form.tipo && l.descricao === t.value && l.status !== 'pulado').sort((a, b) => (a.data || '').localeCompare(b.data || ''));
      const hit = hits[hits.length - 1];
      if (hit && S.form.modo !== 'transf') {
        S.form.categoria = hit.categoria; if (!S.form.valor) S.form.valor = String(hit.valor).replace('.', ',');
        if (!S.form.fornecedor && hit.fornecedor) S.form.fornecedor = hit.fornecedor; if (!S.form.natureza && hit.natureza) S.form.natureza = hit.natureza;
        if (hit.meio === 'conta' || cardById(hit.meio)?.titular === S.form.titular) S.form.meio = hit.meio;
        drawForm(true); const d = $('#fl-desc'); d.focus(); d.setSelectionRange(d.value.length, d.value.length);
      }
      return;
    }
    if (k === 'fornecedor' && S.form.modo !== 'transf') {
      const sug = catDoFornecedor(t.value, S.form.tipo); const tinha = S.form.sugCat || null;
      S.form.sugCat = sug && S.form.categoria && sug !== S.form.categoria ? sug : null;
      if (S.form.sugCat !== tinha) { const box = $('#fl-sugcat'); if (box) box.innerHTML = sugCatHTML(); }
      const hit = fornecedores().get(t.value);
      if (hit) {
        if (!S.form.categoria && catTipo(hit.categoria) === S.form.tipo) S.form.categoria = hit.categoria;
        if (!S.form.natureza && hit.natureza) S.form.natureza = hit.natureza;
        if (!S.form.descricao) S.form.descricao = hit.fornecedor;
        if (S.form.meio === 'conta' && (hit.meio === 'conta' || cardById(hit.meio)?.titular === S.form.titular)) S.form.meio = hit.meio;
        drawForm(!S.form.id); const d = $('#fl-forn'); d.focus(); d.setSelectionRange(d.value.length, d.value.length);
      }
      return;
    }
    if (k === 'titular' || k === 'parcelas' || k === 'para') {
      if (k === 'titular' && !C().cartoes.find(c => c.id === S.form.meio && c.titular === t.value)) S.form.meio = 'conta';
      if (k === 'titular' && S.form.para === t.value) S.form.para = isCx(t.value) ? pessoas()[0].id : outroTit(t.value);
      drawForm(!S.form.id); return;
    }
    if (k === 'data' || k === 'meio') S.form.dirtyComp = true;
    if (k === 'categoria') { if (S.form.sugCat === t.value) S.form.sugCat = null; const box = $('#fl-sugcat'); if (box) box.innerHTML = sugCatHTML(); }
    const h = $('#fl-hint'); if (h) h.innerHTML = hintHTML();
    return;
  }
  if (t.dataset.x && S.cxForm) { S.cxForm[t.dataset.x] = t.type === 'checkbox' ? t.checked : t.value; return; }
  if (t.dataset.r && S.recForm) { const k = t.dataset.r; S.recForm[k] = t.type === 'checkbox' ? t.checked : t.value; if (k === 'titular') S.recForm.meio = 'conta'; if (['titular', 'freq', 'reajMes', 'controle', 'meio'].includes(k) || (k === 'parcelas' && S.recForm.freq === 'parcelas') || (k === 'inicio' && S.recForm.freq === 'parcelas')) { drawRec(); const f = document.getElementById(t.id); if (f && f.type !== 'select-one') { f.focus(); } } return; }
  if (t.dataset.d && S.divForm) { S.divForm[t.dataset.d] = t.value; return; }
  if (t.dataset.fo) { if (t.dataset.fo === 'busca') { S.fornBusca = t.value; clearTimeout(S._ft); S._ft = setTimeout(() => { render(); const b = $('#fo-busca'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 250); } else if (t.dataset.fo === 'todos') { S.fornTodos = t.checked; render(); } else { S.fornNat = t.value; render(); } return; }
  if (t.dataset.filtro) { S.filtro[t.dataset.filtro] = t.value; if (t.dataset.filtro === 'busca') { clearTimeout(S._bt); S._bt = setTimeout(() => { render(); const b = $('#f-busca'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 250); } else render(); return; }
  if (S.imp) {
    if (t.dataset.imp) { S.imp[t.dataset.imp] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.imp === 'titular') S.imp.meio = 'conta'; S.imp.rows.forEach(r => { r.selAuto = true; }); classificaImp(); render(); return; }
    if (t.dataset.imps) { const r = S.imp.rows[Number(t.dataset.imps)]; r.sel = t.checked; r.selAuto = false; render(); return; }
    if (t.dataset.impc) { const r = S.imp.rows[Number(t.dataset.impc)]; r.cat = t.value; r.catManual = true; r.auto = true; if (isFora(r.cat)) { r.nat = 'transferencia'; r.natManual = true; } render(); return; }
    if (t.dataset.impf) { const r = S.imp.rows[Number(t.dataset.impf)]; r.forn = t.value; r.fornManual = true; return; }
    if (t.dataset.impd) { const r = S.imp.rows[Number(t.dataset.impd)]; r.descr = t.value; r.descManual = true; return; }
    if (t.dataset.impn) { const r = S.imp.rows[Number(t.dataset.impn)]; r.nat = t.value; r.natManual = true; return; }
    if (t.id === 'imp-all') { S.imp.rows.forEach(r => { if (!r.ign) { r.sel = t.checked; r.selAuto = false; } }); render(); }
  }
});
document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset;
  if (d.pv != null) { const id = `${S.tit}_${S.mes}`; const doc = S.planos.get(id); if (!doc) return; const v = parseValor(t.value); if (isNaN(v)) return toast('Valor inválido.');
    const next = {...doc, linhas: {...doc.linhas, [d.pv]: round2(v)}, editadoEm: HOJE}; S.planos.set(id, next); render(); if (await put('planos', id, next)) toast('Previsto atualizado.'); return; }
  if (d.ct) { const v = parseValor(t.value); if (!isNaN(v)) saveCtrl('transporte', {[d.ct]: v}); return; }
  if (d.ctd) { const v = Number(t.value); const dias = {...(S.ctrl.transporte?.dias || {}), [d.ctd]: v}; saveCtrl('transporte', {dias}); return; }
  if (d.ck) { const v = parseValor(t.value); if (!isNaN(v)) saveCtrl('marmitas', {[d.ck]: v}); return; }
  if (d.ckq) { const qtd = {...(S.ctrl.marmitas?.qtd || {}), [d.ckq]: Number(t.value) || 0}; saveCtrl('marmitas', {qtd}); return; }
  if (d.cpvai || d.cpq) { const ab = cpAberta(); if (!ab) return; const key = d.cpvai || d.cpq; cpSet(ab[0], c => { const it = (c.itens[key] ||= {qtd: S.compraItens.get(key)?.qtdPadrao ?? 1}); if (d.cpvai) it.vai = t.checked; else it.qtd = Number(t.value) || 0; }); return; }
  if (d.cpfonte) { cpSet(d.cpfonte, c => { c.fonte = t.value; }); S.cpFonte = t.value; return; }
  if (d.cpedit) { const it = S.compraItens.get(d.cpedit); if (!it) return; const v = d.k === 'qtdPadrao' ? (Number(String(t.value).replace(',', '.')) || 0) : t.value; put('compraItens', d.cpedit, {...it, [d.k]: v}); return; }
  if (d.nt && S.nota) { S.nota[d.nt] = t.value; if (d.nt === 'texto') return; return; }
  if (d.ntnovo && S.nota) { S.nota.novos[d.ntnovo] = t.value; return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'lanc-form') submitLanc();
  if (e.target.id === 'cx-form') submitCx();
  if (e.target.id === 'cxr-form') submitCxRend();
  else if (e.target.id === 'rec-form') submitRec();
  else if (e.target.id === 'div-form') submitDiv();
  else if (e.target.id === 'conc-form') submitConciliar();
  else if (e.target.id === 'cpv-form') cpFecharValor();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); if (e.key === 'n' && !$('#modal').innerHTML && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) && S.db && !S.readOnly) { e.preventDefault(); openLanc(null); } });

boot().catch(err => { console.error(err); renderNoDb(); });
})();
