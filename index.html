<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Plano Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F5F4ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plano">
<script>try { const t = localStorage.getItem('pf.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: livro-caixa de trabalho — trilho à esquerda, régua de mês/titular fixa no topo, painéis.
   Visual inspirado no Claude: papel creme, tinta quase preta, acento argila, títulos em serifa, interface em sans. */
:root{
  --bg:#F5F4ED; --surface:#FAF9F5; --sunken:#EDEBE2; --ink:#141413; --muted:#6B6A64; --line:#E3E0D5;
  --accent:#C96442; --accent-soft:#F4E4DB; --on-accent:#FFFFFF;
  --pos:#3F7A4E; --pos-soft:#E3EEDF; --neg:#B3321F; --neg-soft:#F6DED7; --warn:#8A6418; --warn-soft:#F3E9D2;
  --f-display:"Source Serif 4","Tiempos Text",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,20,19,.05),0 4px 14px rgba(20,20,19,.05);
  --ch1:#C96442; --ch2:#1F6FA8; /* séries dos gráficos (validadas: CVD e contraste) */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302E; --sunken:#1F1E1D; --ink:#FAF9F5; --muted:#A6A39A; --line:#3E3D39;
  --accent:#D97757; --accent-soft:#4A3229; --on-accent:#1F1E1D;
  --pos:#7FB98C; --pos-soft:#29362C; --neg:#EE8B78; --neg-soft:#45291F; --warn:#DDB264; --warn-soft:#3C3220;
  --shadow:0 1px 2px rgba(0,0,0,.35); --ch1:#D06A48; --ch2:#4E97D1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --sunken:#1F1E1D; --ink:#FAF9F5; --muted:#A6A39A; --line:#3E3D39;
  --accent:#D97757; --accent-soft:#4A3229; --on-accent:#1F1E1D;
  --pos:#7FB98C; --pos-soft:#29362C; --neg:#EE8B78; --neg-soft:#45291F; --warn:#DDB264; --warn-soft:#3C3220;
  --shadow:0 1px 2px rgba(0,0,0,.35); --ch1:#D06A48; --ch2:#4E97D1; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:15px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:500;font-size:19px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-family:var(--f-num);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--sunken);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav-btn svg{width:16px;height:16px;flex:none}
.rail .spacer{flex:1}
.rail .status{font-size:12px;color:var(--muted);padding:8px 10px}

.main{min-width:0;padding-inline:28px;padding-block:0 96px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:26px;min-width:190px;text-align:center;text-transform:capitalize}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--muted)}
.seg{display:inline-flex;background:var(--sunken);border-radius:7px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--neg)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.matrix tr.saldo td{background:var(--sunken)}
.matrix tr.saldo td:first-child{white-space:normal}
.matrix tr.saldo.fim td{font-weight:600;border-top:2px solid var(--line)}
.matrix tr.saldo.ini td{font-weight:600}
.cp-fontes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cp-fonte{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;color:var(--ink);font:inherit}
.cp-fonte.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cp-fonte .v{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.cp-fonte small{font-size:12px}
.cp-grp{border-top:1px solid var(--line);padding:6px 0}
.cp-grp-h{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.cp-it{display:grid;grid-template-columns:minmax(0,1fr) 76px 92px;gap:10px;align-items:center;padding:5px 0}
.cp-it.off .cp-chk b{color:var(--muted);font-weight:400}
.cp-chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.cp-chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.cp-chk span{display:flex;flex-direction:column;min-width:0}.cp-chk b{font-weight:500}.cp-chk small{font-size:12px}
.cp-q{width:76px;padding:5px 8px}.cp-v{text-align:right;font-size:13px}
.cp-tirar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cp-mk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.cp-mk:first-of-type{border-top:0}
.cp-mk.ok .cp-chk b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pos)}
.cp-mk.ok{background:linear-gradient(90deg,transparent,var(--pos-soft) 160%)}
.cp-mk-f{display:grid;grid-template-columns:64px 74px 92px 86px;gap:6px;align-items:end}
.cp-mk-f label{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-mk-f label span{font-size:11px;color:var(--muted)}
.cp-mk-f .input{padding:7px 8px;min-width:0;width:100%;font-size:15px}
.cp-mk-f select.input{padding:7px 22px 7px 8px}
.cp-mk-t{text-align:right;font-weight:600;padding-bottom:8px}
.cp-extra{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.cp-extra-f{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 64px 74px 92px auto;gap:6px;margin-top:8px}
.cp-extra-f .input{min-width:0;width:100%}
.cp-meta-btn{all:unset;cursor:pointer;font:inherit;color:inherit;border-bottom:1px dashed var(--muted)}
.cp-bar small{font-size:11.5px}
.cp-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:12px -18px -18px;padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r);z-index:2}
.cp-bar div{display:flex;flex-direction:column}.cp-bar b{font-size:17px}
@media (max-width:760px){.cp-mk{grid-template-columns:1fr}.cp-mk-f{grid-template-columns:62px 72px minmax(0,1fr) 84px}.cp-extra-f{grid-template-columns:1fr 1fr}.cp-extra-f #cpx-nome{grid-column:1/-1}.cp-extra-f .btn{grid-column:1/-1}.cp-merc .cp-bar div{min-width:0}.cp-fontes{grid-template-columns:1fr}.cp-it{grid-template-columns:minmax(0,1fr) 64px 78px}.cp-q{width:64px}.cp-bar{gap:4px 14px;bottom:76px;padding:10px 14px;margin:12px -18px -18px;box-shadow:0 -6px 16px rgba(0,0,0,.06)}.cp-bar .eyebrow{font-size:11.5px}.cp-bar b{font-size:15px}.cp-bar .lbl-long{display:none}.cp-bar>span{margin-left:0!important;width:100%;flex-wrap:nowrap!important}.cp-bar>span .btn{flex:1;padding:6px 10px}}
/* placar de caixa */
.placar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.placar .pl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px 4px}
.placar .pl-head h3{margin:0}
.pl-row{display:flex;align-items:stretch;padding:8px 10px 12px;gap:2px}
.pl-row + .pl-row{border-top:1px dashed var(--line);padding-top:12px}
.pl-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center}
.pl-c{flex:1 1 0;min-width:0;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column;gap:3px}
.pl-c .v{font-family:var(--f-display);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.pl-c .s{font-size:12px;color:var(--muted)}
.pl-c.tot{background:var(--sunken)}
.pl-c.hoje{background:var(--accent-soft)} .pl-c.hoje .eyebrow{color:var(--accent)}
.pl-op{align-self:center;flex:0 0 22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--bg)}
.pl-foot{padding:10px 18px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.pl-foot .meter{width:120px;margin:0}
@media (max-width:860px){.pl-row{flex-wrap:wrap}.pl-c{flex:1 1 40%}.pl-op{display:none}.pl-lbl{writing-mode:horizontal-tb;transform:none;flex:1 0 100%;text-align:left;padding:0 10px}}
.kpi-hoje{background:var(--accent-soft)}
.kpi-hoje .eyebrow{color:var(--accent)}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--accent)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
.alert.ok{background:var(--pos-soft);color:var(--pos)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-num)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.prev{background:var(--warn-soft);color:var(--warn)}
.chip.imp{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.warn{color:var(--warn)}
.div-tg{border:0;background:none;color:var(--muted);cursor:pointer;width:20px;padding:0;font-size:13px;margin-right:2px}
.div-tg-sp{display:inline-block;width:22px}
.div-obs{display:block;max-width:420px;margin-left:22px}
tr.div-grp td{background:var(--sunken);font-weight:600;font-size:12.5px;letter-spacing:.02em}
tr.div-det>td{padding-top:0;background:var(--sunken)}
table.div-sub{width:100%;font-size:13px;margin:4px 0 10px}
table.div-sub th{font-size:12px}
.div-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.show-sm{display:none}
@media (max-width:700px){.div-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .div-tbl .hide-sm,.div-sub .hide-sm{display:none} .div-tbl .show-sm,.div-sub .show-sm{display:block;margin-top:2px} .div-sub .btn .show-sm{margin:0} .div-tbl,.div-sub{min-width:0!important;width:100%} .div-tbl td,.div-sub td{word-break:break-word} .div-obs{margin-left:0} table.div-sub{font-size:12.5px}}

.gbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.gbar .track{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.gbar .track b{display:block;height:100%;background:var(--accent);border-radius:4px}
.gbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunken)}
tr.is-prev td{color:var(--muted)}
tr.is-skip td{opacity:.45;text-decoration:line-through}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check.on{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.check svg{width:12px;height:12px}

/* Matriz do fluxo */
.matrix{font-size:13px}
.matrix td,.matrix th{padding:6px 10px;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:3;width:230px;min-width:230px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.matrix td.cur,.matrix th.cur{position:sticky;left:230px;z-index:2;box-shadow:inset -1px 0 0 var(--line),4px 0 8px -6px rgba(0,0,0,.25)}
.matrix th.cur{z-index:4}
.matrix tr.sec td{position:static}
.matrix tr.sec td:first-child{position:sticky}
.matrix tr.hoje td{color:var(--accent);font-weight:600}
@media (max-width:820px){.matrix th:first-child,.matrix td:first-child{width:150px;min-width:150px;max-width:150px}.matrix td.cur,.matrix th.cur{left:150px}}
.matrix tbody tr:hover td{background:var(--sunken)}
.matrix tr.sec td{background:var(--sunken);font-family:var(--f-display);font-weight:600;font-size:14px}
.matrix tr.grp td{font-weight:600;cursor:pointer}
.matrix tr.grp td:first-child::before{content:"▸";display:inline-block;width:12px;margin-right:6px;text-align:center;color:var(--muted);transition:transform .15s}
.matrix tr.grp.open td:first-child::before{transform:rotate(90deg)}
.matrix tr.cat td:first-child{padding-left:30px;color:var(--muted)}
.matrix tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.matrix td.fut{font-style:italic}
.matrix th.cur,.matrix td.cur{background:var(--accent-soft)!important}
.matrix td.cell{cursor:pointer}
.matrix td.cell:hover{text-decoration:underline}

.cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cardpick{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;min-width:190px;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit}
/* identidade de cada emissor: cores da marca (sem logotipos) */
.cbrand{--accent:#fff;--warn:#FFD166;--neg:#FF9A8B;background:linear-gradient(135deg,var(--ca) 0%,var(--cb) 100%)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 6px 18px rgba(0,0,0,.14);position:relative;overflow:hidden}
.cbrand::after{content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.cbrand small,.cbrand .eyebrow,.cbrand .muted,.cbrand .in-card small,.cbrand span.muted{color:rgba(255,255,255,.85)!important}
.cbrand .chip{background:rgba(255,255,255,.2)!important;color:#fff!important;border-color:transparent!important}
.cbrand .lim-meter{background:rgba(255,255,255,.28)}
.cbrand .neg{color:#FFD3CC!important}.cbrand .warn{color:#FFE7A3!important}
.cbrand .mk{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.92}
.cbrand .emv{width:26px;height:19px;border-radius:4px;background:linear-gradient(135deg,#F2DD95,#B8913A);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:0 0 auto}
.cardpick.cbrand[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg,#fff),0 0 0 4px var(--ink)}
.cardpick.cbrand[aria-pressed="false"]{opacity:.82}
.mes-chk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px 8px;margin-top:6px}
.mes-chk label{display:flex;align-items:center;gap:4px;font-size:12.5px;cursor:pointer}
.mes-chk input{accent-color:var(--accent)}
.cbrand .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}

table.mini{font-size:13px}table.mini td,table.mini th{padding:5px 8px}
.orc input.pv{width:110px;text-align:right;padding:4px 8px}
.alert{flex-wrap:wrap;align-items:center}

.fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;height:52px;padding:0 22px 0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 20px rgba(201,100,66,.30)}

/* Diálogo */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{position:relative;width:min(540px,100%);max-height:calc(100vh - 48px);background:var(--surface);overflow-y:auto;padding:22px 24px 22px;display:flex;flex-direction:column;gap:16px;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}

@media (max-width:600px){
  .scrim{align-items:flex-end;padding:0}
  .sheet,.sheet.center{width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field .input{width:100%}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount{font-family:var(--f-display);font-size:32px;font-weight:500;border:0;border-bottom:2px solid var(--line);background:none;padding:4px 0;width:100%;letter-spacing:-.02em}
.amount:focus{outline:none;border-color:var(--accent)}
.tipo-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:8px;padding:3px}
.tipo-seg button{border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tipo-seg button[aria-pressed="true"].s{background:var(--neg-soft);color:var(--neg)}
.tipo-seg button[aria-pressed="true"].e{background:var(--pos-soft);color:var(--pos)}
.tipo-seg.t3{grid-template-columns:repeat(3,1fr)}
.tipo-seg.one{grid-template-columns:1fr}
.tipo-seg button[aria-pressed="true"].t{background:var(--accent-soft);color:var(--accent)}
.tipo-seg button:disabled{cursor:default}
.hint{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:8px 10px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.switch input{width:16px;height:16px;accent-color:var(--accent)}

.sugcat{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toast-undo{margin-left:10px;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .rail .brand{padding:4px 10px 4px 0}
  .rail .spacer,.rail .status{display:none}
  .nav-btn{white-space:nowrap}
  .main{padding-inline:16px}
  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .month h1{font-size:20px;min-width:150px}
  .fields2,.fields3{grid-template-columns:1fr}
  .fab{right:16px}
  .gbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
  .fat-strip{grid-template-columns:repeat(6,minmax(0,1fr))}
  .fat-strip button:nth-child(n+7){display:none}
}

/* ============ início (tela de acompanhamento, pensada para o celular) ============ */
.in{display:flex;flex-direction:column;gap:18px;max-width:760px;margin:0 auto}
.in-hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;box-shadow:var(--shadow)}

.in-hero .big{font-family:var(--f-display);font-size:40px;line-height:1.1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 2px;white-space:nowrap}
.in-proj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

.in-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}

.in-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.in-it{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.in-it:first-child{border-top:0}
.in-dt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:var(--sunken);line-height:1.05}

.in-dt.fat{background:var(--accent-soft)}
.in-tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.in-tx b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.in-v{display:flex;align-items:center;gap:10px}
.in-v .num{font-weight:600}
.in-v .check{flex:none}
.in-empty{padding:18px;color:var(--muted);text-align:center;font-size:13.5px}
.in-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}

.in-card{flex:0 0 min(78%,280px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.in-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.in-card .v{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.in-card .lim-meter{height:8px;border-radius:4px}

.in-cx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}

.in-meta .lim-meter{grid-column:1/3;height:8px;border-radius:4px}
.in-meta small{grid-column:1/3;font-size:12px;color:var(--muted)}
.in-mes{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);font:inherit}

.in-mes .val{display:flex;flex-direction:column;align-items:flex-end}
.in-mes .val b{font-variant-numeric:tabular-nums}
.in-mes .val small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.in-alert{border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}

.in-card .nx{display:flex;flex-direction:column;gap:2px;font-size:12.5px}

.st{align-self:flex-start;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-flex;gap:4px;align-items:center}

.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:4px}

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const ymAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); const t = y * 12 + m - 1 + k; return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`; };
const ymDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const ymLong = ym => { const [y, m] = ym.split('-').map(Number); return `${MESES[m - 1]} ${y}`; };
const ymShort = ym => { const [y, m] = ym.split('-').map(Number); return `${MES3[m - 1]}/${String(y).slice(2)}`; };
const now = new Date();
const HOJE = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const HOJE_YM = HOJE.slice(0, 7);
const parseValor = s => { if (typeof s === 'number') return s; s = String(s || '').replace(/[R$\s]/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ICON = {

  importar:'<path d="M10 3v10M6 9l4 4 4-4M4 16h12"/>',
  ajustes:'<circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/>',

    else { if (real) o.sR += v; else o.sP += v; }
  }
  if (ym < HOJE_YM && ym >= caixaDesde()) for (const t of ids) { const pg = fc.paidIn[t + '|' + ym] || 0; o.sR += pg; o.fatPagas += pg; }
  if (ym >= HOJE_YM) for (const t of ids) {

function gastoImp(ym, t) { const E = engine(); return round2([...(E.byMonth.get(ym) || []), ...(E.byMonth.get(ymAdd(ym, 1)) || []), ...(E.byMonth.get(ymAdd(ym, -1)) || [])].filter(i => i.titular === t && isImp(i) && i.status === 'realizado' && (i.data || i.competencia + '-01').startsWith(ym)).reduce((s, i) => s + (i.tipo === 'saida' ? i.valor : -i.valor), 0)); } // pela data da compra, mesmo no cartão

function metaInv(ym, tit) {

function makeSupaDb(sb) {
  const cache = {}, loading = {}, subs = [];
  const cmp = (a, op, v) => op === '>=' ? a >= v : op === '<=' ? a <= v : op === '==' ? a === v : op === '<' ? a < v : op === '>' ? a > v : op === '!=' ? a !== v : true;
  async function load(col) {
    if (loading[col]) return loading[col];
    return loading[col] = (async () => { const m = new Map(); for (let from = 0; ; from += 1000) { const {data, error} = await sb.from('docs').select('id,data').eq('col', col).range(from, from + 999); if (error) throw error; data.forEach(r => m.set(r.id, r.data)); if (data.length < 1000) break; } cache[col] = m; return m; })();
  }
  function fire(s) {
    const m = cache[s.col] || new Map();
    if (s.docId) { const d = m.get(s.docId); s.cb({id: s.docId, exists: d !== undefined, data: () => d}); return; }
    const docs = [...m].filter(([, d]) => s.where.every(([f, op, v]) => cmp(d?.[f], op, v))).map(([id, d]) => ({id, data: () => d}));
    s.cb({docs, size: docs.length, empty: !docs.length});
  }
  const emit = col => subs.filter(s => s.col === col).forEach(fire);
  sb.channel('docs-sync').on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if (!r?.col || !cache[r.col]) return;
    if (p.eventType === 'DELETE') cache[r.col].delete(r.id); else cache[r.col].set(r.id, r.data);
    emit(r.col);
  }).subscribe();
  const listen = (col, where, docId) => (cb, err) => { const s = {col, where, docId, cb}; subs.push(s); load(col).then(() => fire(s), e => err && err(e)); return () => subs.splice(subs.indexOf(s), 1); };
  const docRef = (col, id) => ({
    onSnapshot: listen(col, [], id),
    async set(data) { const {error} = await sb.from('docs').upsert({col, id, data}); if (error) throw error; (cache[col] ||= new Map()).set(id, data); emit(col); },
    async delete() { const {error} = await sb.from('docs').delete().eq('col', col).eq('id', id); if (error) throw error; cache[col]?.delete(id); emit(col); },
  });
  const query = (col, where = []) => ({where: (f, op, v) => query(col, [...where, [f, op, v]]), limit: () => query(col, where), onSnapshot: listen(col, where), doc: id => docRef(col, id)});

}

}

  const plano = {}; for (const [, d] of docs) if (d) for (const [c, v] of Object.entries(d.linhas || {})) plano[c] = round2((plano[c] || 0) + v);
  const fc = engine().faturaCaixa, real = {}, pend = {};

      <td class="r num muted">${num(pd)}</td><td class="r num">${num(pj)}</td><td class="r num ${ruim ? 'neg' : Math.abs(dif) > 0.004 ? 'pos' : 'muted'}">${Math.abs(dif) > 0.004 ? (dif > 0 ? '+' : '−') + fmt(Math.abs(dif)).replace('R$', '').trim() : '–'}</td></tr>`;

/* ============ fornecedores ============ */
function vFornecedores() {
  const N = S.fornPer || 6; const ms = []; for (let k = N - 1; k >= 0; k--) ms.push(ymAdd(S.mes, -k));
  const q = norm(S.fornBusca || ''); const natF = S.fornNat || '';
  const map = new Map(); const porNat = {};
  for (const m of ms) for (const it of itensMes(m)) {
    if (it.tipo !== 'saida' || it.status === 'pulado' || isFora(it.categoria)) continue;
    if (!S.fornTodos && !it.fornecedor) continue;
    const key = it.fornecedor || it.descricao;
    let f = map.get(key); if (!f) map.set(key, f = {nome: key, sem: !it.fornecedor, total: 0, n: 0, porMes: {}, nats: {}, cats: {}, meios: {}, ultimo: '', prev: 0});
    const nat = it.natureza || 'avulso';
    f.total += it.valor; f.n++; f.porMes[m] = (f.porMes[m] || 0) + it.valor; f.nats[nat] = (f.nats[nat] || 0) + it.valor; f.cats[it.categoria] = (f.cats[it.categoria] || 0) + it.valor; f.meios[it.meio || 'conta'] = 1;
    if ((it.data || '') > f.ultimo) f.ultimo = it.data || ''; if (it.status === 'previsto') f.prev += it.valor;
    porNat[nat] = (porNat[nat] || 0) + it.valor;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0]?.[0];
  let list = [...map.values()].map(f => { f.meses = Object.keys(f.porMes).length; f.nat = top(f.nats); f.cat = top(f.cats); f.media = f.total / N; f.habito = f.nat === 'avulso' && N >= 3 && f.meses >= Math.ceil(N * .6); return f; });
  list = list.filter(f => (!q || norm(f.nome).includes(q)) && (!natF || f.nat === natF || (natF === 'habito' && f.habito)));
  list.sort((a, b) => b.total - a.total);
  const tot = list.reduce((s, f) => s + f.total, 0);
  const mx = Math.max(1, ...list.flatMap(f => Object.values(f.porMes)));
  const k = (id, lbl) => `<div class="kpi"><span class="eyebrow">${lbl}</span><span class="v">${fmt((porNat[id] || 0) / N)}</span><span class="s">média por mês · ${fmt(porNat[id] || 0)} no período</span></div>`;
  const spark = f => `<svg class="spark" viewBox="0 0 ${N * 8} 22" width="${N * 8}" height="22" aria-hidden="true">${ms.map((m, i) => { const v = f.porMes[m] || 0; const h = v ? Math.max(2, v / Math.max(...Object.values(f.porMes)) * 20) : 1; return `<rect x="${i * 8 + 1}" y="${22 - h}" width="6" height="${h}" rx="1" fill="${v ? 'var(--accent)' : 'var(--line)'}"/>`; }).join('')}</svg>`;
  return `<div class="kpis" style="margin-bottom:18px">${k('assinatura', 'Assinaturas')}${k('recorrente', 'Contas recorrentes')}${k('parcelado', 'Parcelamentos')}${k('avulso', 'Gastos avulsos')}</div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Período">${[3, 6, 12].map(n => `<button data-act="fornPer" data-n="${n}" aria-pressed="${N === n}">${n} meses</button>`).join('')}</div>
      <input class="input" id="fo-busca" type="search" placeholder="Buscar fornecedor" value="${esc(S.fornBusca || '')}" data-fo="busca" style="flex:1;min-width:160px">
      <select class="input" id="fo-nat" data-fo="nat"><option value="">Toda natureza</option>${NATUREZAS.filter(n => !['transferencia', 'ajuste'].includes(n[0])).map(([id, n]) => `<option value="${id}" ${natF === id ? 'selected' : ''}>${n}</option>`).join('')}<option value="habito" ${natF === 'habito' ? 'selected' : ''}>Avulso, mas frequente</option></select>
      <label class="switch"><input type="checkbox" id="fo-todos" data-fo="todos" ${S.fornTodos ? 'checked' : ''}>Incluir linhas sem fornecedor</label>
      <span class="muted" style="font-size:12.5px">${ymShort(ms[0])} a ${ymShort(ms[ms.length - 1])} · saídas, sem transferências</span>
    </div>
    ${list.length ? `<div class="tbl-wrap"><table class="mc"><thead><tr><th>Fornecedor</th><th>Natureza</th><th>Categoria</th><th>Meses</th><th class="r">Lanç.</th><th class="r">Total</th><th class="r">% do período</th><th class="r">Média/mês</th><th>Último</th></tr></thead><tbody>
      ${list.map(f => `<tr class="clickrow" data-act="fornGo" data-f="${esc(f.nome)}"><td class="m-main"><span class="with-logo">${logoF(f.nome)}<span><b style="font-weight:500">${esc(f.nome)}</b>${f.sem ? '<br><small class="muted">sem fornecedor (linha da planilha)</small>' : ''}</span></span></td>
        <td class="m-sub">${f.habito ? '<span class="chip prev">Avulso frequente</span>' : `<span class="chip ${['assinatura', 'recorrente'].includes(f.nat) ? 'acc' : f.nat === 'parcelado' ? 'prev' : ''}">${esc(natNome(f.nat))}</span>`}</td>
        <td class="muted m-sub">${esc(catNome(f.cat))}</td><td class="m-sub">${spark(f)} <span class="muted num" style="font-size:12px">${f.meses}/${N}</span></td>
        <td class="r num m-hide">${f.n}</td><td class="r num m-val"><b>${fmt(f.total)}</b>${f.prev ? `<br><small class="muted">${fmt(f.prev)} previsto</small>` : ''}</td><td class="r num muted m-hide">${tot ? (f.total / tot * 100).toLocaleString('pt-BR', {maximumFractionDigits: 1}) : 0}%</td>
        <td class="r num m-sub">${fmt(f.media)}<span class="only-m">/mês em média</span></td><td class="muted num m-hide">${f.ultimo ? f.ultimo.split('-').reverse().join('/') : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="panel empty"><h3>Nenhum fornecedor no período</h3><p>Lançamentos com fornecedor aparecem aqui. Importe faturas ou preencha o campo Fornecedor ao lançar.</p></div>`}
    <p class="muted" style="font-size:12.5px">“Avulso frequente” marca gastos avulsos que aparecem em pelo menos 60% dos meses: bons candidatos a virar orçamento fixo. Clique numa linha para ver os lançamentos.</p>`;
}

/* ============ recorrências ============ */

    ${list.length ? `<div class="tbl-wrap"><table class="mc"><thead><tr><th>Descrição · fornecedor</th><th>Natureza</th><th>Categoria</th><th>Meio</th>${S.tit === 'casal' ? '<th>Titular</th>' : ''}<th>Período</th><th class="r">Valor</th><th></th></tr></thead><tbody>
      ${list.map(([id, r]) => { const fim = r.fim && r.fim < HOJE_YM; return `<tr class="${r.ativo === false || fim ? 'is-prev' : ''}"><td class="m-main" data-act="editRec" data-id="${esc(id)}" style="cursor:pointer"><span class="with-logo">${logoF(r.fornecedor || r.descricao)}<span><b style="font-weight:500">${esc(r.descricao)}</b>${r.ativo === false ? ' <span class="chip">pausada</span>' : fim ? ' <span class="chip">encerrada</span>' : ''}${r.fornecedor ? `<br><small>${fornTag(r.fornecedor)}</small>` : ''}</span></span></td><td class="m-sub">${r.natureza ? `<span class="chip ${['assinatura', 'recorrente'].includes(r.natureza) ? 'acc' : ''}">${esc(natNome(r.natureza))}</span>` : ''}</td><td class="muted m-sub">${esc(catNome(r.categoria))}</td><td class="muted m-sub">${esc(meioNome(r.meio))}</td>${S.tit === 'casal' ? `<td class="muted m-sub">${esc(titNome(r.titular))}</td>` : ''}<td class="muted num m-sub">${ymShort(r.inicio)} → ${r.fim ? ymShort(r.fim) : 'sem fim'}${r.parcelas ? ` · ${r.parcelas}×` : ''}${recFreqTxt(r) !== 'todo mês' ? `<br><small>${esc(recFreqTxt(r))}</small>` : ''}${r.reajuste?.mes ? `<br><small>reajuste ${MES3[r.reajuste.mes - 1]} · ${r.reajuste.pct != null ? r.reajuste.pct.toLocaleString('pt-BR') + '%' : 'IPCA ~' + ipca().toLocaleString('pt-BR') + '%'}</small>` : ''}${r.controle ? `<br><small>via Controles (${r.controle})</small>` : ''}</td><td class="r num m-val ${r.tipo === 'saida' ? 'neg' : 'pos'}">${r.tipo === 'saida' ? '−' : '+'}${fmt(recValor(r, S.mes < r.inicio ? r.inicio : S.mes))}${r.pctDe ? `<br><small class="muted">${String(r.pct).replace('.', ',')}% de ${esc(S.recs.get(r.pctDe)?.descricao || '')}</small>` : ''}${(r.reajuste?.mes || r.controle) && Math.abs(recValor(r, S.mes < r.inicio ? r.inicio : S.mes) - r.valor) > 0.004 ? `<br><small class="muted">base ${fmt(r.valor)}</small>` : ''}</td><td class="r m-act"><button class="btn ghost sm" data-act="editRec" data-id="${esc(id)}">Editar</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="panel empty"><h3>Nenhuma recorrência</h3><p>Cadastre salário, aluguel e assinaturas uma vez e elas aparecem em todos os meses.</p></div>`}`;
}

/* ============ dívidas ============ */
const DIV_GRUPOS = [['bancos', 'Bancos e cartões'], ['consumo', 'Consumo, serviços e conselhos'], ['empresa', 'Empresa (NCX)'], ['', 'Outras']];
function addDiasISO(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function diasAte(iso) { return Math.round((new Date(iso + 'T12:00:00') - new Date(HOJE + 'T12:00:00')) / 864e5); }
function divItemSit(it) { if (it.pago) return 'pago'; if (it.st === 'vencido' || (it.v && it.v < HOJE)) return 'vencido'; return 'avencer'; }
function divCalc(d) {
  if (!Array.isArray(d.itens) || !d.itens.length) return {av: d.aVencer || 0, vc: d.vencidas || 0, d30: 0};
  let av = 0, vc = 0, d30 = 0; const lim = addDiasISO(HOJE, 30);
  d.itens.forEach(it => { const s = divItemSit(it), v = Number(it.valor) || 0; if (s === 'vencido') vc += v; else if (s === 'avencer') { av += v; if (it.v && it.v <= lim) d30 += v; } });
  return {av: round2(av), vc: round2(vc), d30: round2(d30)};
}
function divSitChip(it) {
  const s = divItemSit(it);
  if (s === 'pago') return '<span class="chip ok">pago</span>';
  if (s === 'vencido') return `<span class="chip neg">${it.v ? `vencido há ${-diasAte(it.v)}d` : 'vencido'}</span>`;
  if (it.v) { const n = diasAte(it.v); return `<span class="chip ${n <= 30 ? 'prev' : ''}">${n === 0 ? 'vence hoje' : `vence em ${n}d`}</span>`; }
  return '<span class="chip">a vencer</span>';
}
function vDividas() {
  const vis = d => S.tit === 'casal' || d.titular === S.tit || (S.tit === 'nycolas' && d.titular === 'pj');
  const list = [...S.divs].filter(([, d]) => vis(d)).sort((a, b) => (a[1].status === 'quitada') - (b[1].status === 'quitada') || (a[1].prioridade ?? 99) - (b[1].prioridade ?? 99) || divTot(b[1]) - divTot(a[1]));
  const at = list.filter(([, d]) => d.status !== 'quitada');
  let tv = 0, tvc = 0, t30 = 0; at.forEach(([, d]) => { const c = divCalc(d); tv += c.av; tvc += c.vc; t30 += c.d30; });
  const lim = addDiasISO(HOJE, 30);
  const prox = []; at.forEach(([id, d]) => (d.itens || []).forEach(it => { if (divItemSit(it) === 'avencer' && it.v && it.v <= lim) prox.push({id, credor: d.credor, it}); }));
  prox.sort((a, b) => a.it.v.localeCompare(b.it.v));
  S.divOpen = S.divOpen || new Set();
  const cols = 8;
  const linha = ([id, d]) => {
    const c = divCalc(d), open = S.divOpen.has(id), temItens = Array.isArray(d.itens) && d.itens.length;
    const head = `<tr class="${d.status === 'quitada' ? 'is-prev' : ''} div-row">
      <td class="r num hide-sm">${d.prioridade ?? '–'}</td>
      <td>${temItens ? `<button class="div-tg" data-act="divToggle" data-id="${esc(id)}" aria-expanded="${open}" aria-label="Ver composição">${open ? '▾' : '▸'}</button>` : '<span class="div-tg-sp"></span>'}<b style="font-weight:500">${esc(d.credor)}</b>${d.status === 'quitada' ? ' <span class="chip ok">quitada</span>' : d.noFluxo ? ' <span class="chip acc">no fluxo</span>' : ''}${d.obs ? `<br><small class="muted div-obs">${esc(d.obs)}</small>` : ''}</td>
      <td class="muted hide-sm">${esc(d.tipo)}</td><td class="r num hide-sm">${fmt(c.av)}${c.d30 ? `<br><small class="warn">${fmt(c.d30)} em 30d</small>` : ''}</td><td class="r num hide-sm ${c.vc ? 'neg' : ''}">${fmt(c.vc)}</td><td class="r num"><b>${fmt(c.av + c.vc)}</b>${c.vc ? `<small class="show-sm neg">${fmt(c.vc)} vencido</small>` : ''}</td>
      <td class="muted num hide-sm">${d.atualizadoEm ? d.atualizadoEm.split('-').reverse().join('/') : ''}${d.fonte ? `<br><small>${esc(d.fonte)}</small>` : ''}</td>
      <td class="r hide-sm"><button class="btn ghost sm" data-act="editDiv" data-id="${esc(id)}">Editar</button></td></tr>`;
    if (!open || !temItens) return head;
    return head + `<tr class="div-det"><td class="hide-sm"></td><td colspan="${cols - 1}"><table class="div-sub"><thead><tr><th>Composição</th><th class="hide-sm">Vencimento</th><th class="r hide-sm">Original</th><th class="r">Valor</th><th class="hide-sm">Situação</th><th></th></tr></thead><tbody>
      ${d.itens.map((it, i) => `<tr class="${it.pago ? 'is-prev' : ''}"><td>${esc(it.d)}${it.obs ? `<br><small class="muted">${esc(it.obs)}</small>` : ''}</td><td class="num muted hide-sm">${it.v ? it.v.split('-').reverse().join('/') : '–'}</td><td class="r num muted hide-sm">${it.base != null ? fmt(it.base) : ''}</td><td class="r num">${fmt(it.valor)}<span class="show-sm">${divSitChip(it)}</span></td><td class="hide-sm">${divSitChip(it)}${it.est ? ' <span class="chip">estimativa</span>' : ''}</td><td class="r"><button class="btn ghost sm" data-act="divPago" data-id="${esc(id)}" data-i="${i}" ${S.readOnly ? 'disabled' : ''}><span class="hide-sm">${it.pago ? 'Desfazer' : 'Marcar pago'}</span><span class="show-sm" aria-hidden="true">${it.pago ? '↺' : '✓'}</span></button></td></tr>`).join('')}
      </tbody></table></td></tr>`;
  };
  const grupos = DIV_GRUPOS.map(([g, nome]) => [nome, list.filter(([, d]) => (d.grupo || '') === g || (g === '' && !DIV_GRUPOS.some(x => x[0] && x[0] === d.grupo)))]).filter(([, l]) => l.length);
  const EV = endividamento(S.tit);
  return `<div class="kpis div-kpis" style="margin-bottom:8px">
      <div class="kpi"><span class="eyebrow">Endividamento total</span><span class="v">${fmt(EV.tot)}</span><span class="s">tudo o que se deve hoje</span></div>
      <div class="kpi"><span class="eyebrow">Fora do fluxo</span><span class="v ${EV.vc ? 'neg' : ''}">${fmt(EV.nc)}</span><span class="s">${fmt(EV.vc)} vencido · Serasa, SPC, atrasos</span></div>
      <div class="kpi"><span class="eyebrow">No fluxo</span><span class="v">${fmt(EV.corr)}</span><span class="s">cartões ${fmt(EV.cart)} · parcelas ${fmt(EV.parc)}</span></div>
      ${(() => { const cob = EV.tot > 0.01 ? EV.at / EV.tot * 100 : null; return `<div class="kpi"><span class="eyebrow">Ativos cobrem</span><span class="v ${cob != null && cob < 100 ? 'neg' : ''}">${cob == null ? '–' : cob.toLocaleString('pt-BR', {maximumFractionDigits: cob < 10 ? 1 : 0}) + '%'}</span><span class="s">da dívida · caixa ${fmt(EV.caixa)} + investido ${fmt(EV.res)}</span></div>`; })()}</div>
    ${t30 ? `<p style="margin:0 0 10px">Vencem <b class="num">${fmt(t30)}</b> nos próximos 30 dias.</p>` : ''}
    <details class="help"><summary>Como o endividamento é calculado</summary><p>Fora do fluxo: as dívidas desta lista que ainda não entram no caixa. No fluxo: o limite usado dos cartões (fatura aberta e parcelas futuras) e as parcelas de empréstimos, financiamentos e compras parceladas já previstas. Dívidas marcadas "no fluxo" aparecem na lista, mas contam só uma vez, pelas parcelas.</p><p>Clique em ▸ para ver o que compõe cada dívida. Itens com data passada viram "vencido" sozinhos; marque como pago quando quitar.</p></details>
    ${prox.length ? `<div class="panel" style="margin-bottom:20px"><h3 style="margin:0 0 8px">Próximos vencimentos</h3>${prox.map(p => `<div class="row"><div class="t"><b>${esc(p.it.d)}</b><small>${esc(p.credor)} · ${p.it.v.split('-').reverse().join('/')}${p.it.est ? ' · estimativa' : ''}</small></div><span class="num">${fmt(p.it.valor)}</span><span>${divSitChip(p.it)}</span></div>`).join('')}</div>` : ''}
    <div class="panel-head"><h3>Dívidas cadastradas</h3><button class="btn primary" data-act="newDiv" ${S.readOnly ? 'disabled' : ''}>Nova dívida</button></div>
    ${list.length ? `<div class="tbl-wrap"><table class="div-tbl"><thead><tr><th class="r hide-sm">Prior.</th><th>Credor</th><th class="hide-sm">Tipo</th><th class="r hide-sm">A vencer</th><th class="r hide-sm">Vencido</th><th class="r">Total</th><th class="hide-sm">Atualizada</th><th class="hide-sm"></th></tr></thead><tbody>
      ${grupos.map(([nome, l]) => { let a = 0, v = 0; l.filter(([, d]) => d.status !== 'quitada').forEach(([, d]) => { const c = divCalc(d); a += c.av; v += c.vc; }); return `<tr class="div-grp"><td class="hide-sm"></td><td>${esc(nome)}</td><td class="hide-sm"></td><td class="r num hide-sm">${fmt(a)}</td><td class="r num hide-sm ${v ? 'neg' : ''}">${fmt(v)}</td><td class="r num">${fmt(a + v)}</td><td class="hide-sm"></td><td class="hide-sm"></td></tr>` + l.map(linha).join(''); }).join('')}
    </tbody></table></div>` : `<div class="panel empty"><h3>Nenhuma dívida fora do fluxo</h3><p>${EV.corr > 0.01 ? `O endividamento de ${fmt(EV.tot)} vem só do que já está no fluxo: cartões (${fmt(EV.cart)}) e parcelas previstas (${fmt(EV.parc)}).` : 'Cadastre aqui dívidas que ainda não estão no fluxo, como Serasa, SPC ou contas em atraso.'}</p><div class="acts">${EV.cart > 0.01 ? '<button class="btn" data-act="nav" data-v="cartoes">Ver cartões</button>' : ''}${EV.parc > 0.01 ? '<button class="btn" data-act="nav" data-v="fluxo">Ver parcelas no fluxo</button>' : ''}</div></div>`}`;
}
function divTot(d) { const c = divCalc(d); return c.av + c.vc; }
async function divTogglePago(id, i) {

async function toggle(id) {
  if (S.readOnly) return;
  const it = findItem(id); if (!it) return;
  if (it.distrib) return confirmaDistrib(it.competencia);
  if (it.virtual) return put('lancamentos', 'rx-' + uid(), limpaVirtual(it));
  const old = S.lanc.get(id);
  return put('lancamentos', id, {...old, status: old.status === 'realizado' ? 'previsto' : 'realizado'});
}
function limpaVirtual(it) { const {id, virtual, valorOriginal, consumido, controle, distrib, ...rest} = it; return {...rest, status: 'realizado', origem: 'recorrencia'}; }
async function confirmaDistrib(ym) {
  const E = engine().byMonth.get(ym) || []; const a = E.find(i => i.id === 'vd:pj:' + ym), b = E.find(i => i.id === 'vd:pf:' + ym); if (!a || !b) return;
  const id = 'ds-' + uid(); const clean = x => { const {id: _, virtual, distrib, valorOriginal, consumido, ...r} = x; return {...r, status: 'realizado', origem: 'distribuicao'}; };
  const ok = await putMany('lancamentos', [[id, {...clean(a), par: id + '-pf'}], [id + '-pf', {...clean(b), par: id}]]);
  if (ok) toast('Distribuição confirmada nos dois lados.');
}
async function confirmAll() {
  const cids = engine().faturaCaixa.cardIds, viaFat = S.mes >= HOJE_YM;

    if (it.distrib) { if (feitos.has(it.competencia)) continue; feitos.add(it.competencia); const E = engine().byMonth.get(it.competencia) || []; const pa = E.find(x => x.id === 'vd:pj:' + it.competencia), pb = E.find(x => x.id === 'vd:pf:' + it.competencia); const id = 'ds-' + uid(); const clean = x => { const {id: _, virtual, distrib, valorOriginal, consumido, ...r} = x; return {...r, status: 'realizado', origem: 'distribuicao'}; }; if (pa && pb) entries.push([id, {...clean(pa), par: id + '-pf'}], [id + '-pf', {...clean(pb), par: id}]); continue; }
    if (it.virtual) entries.push(['rx-' + uid(), limpaVirtual(it)]); else entries.push([it.id, {...S.lanc.get(it.id), status: 'realizado'}]);

async function exportar() {
  const rows = [['competencia', 'data', 'titular', 'tipo', 'descricao', 'fornecedor', 'natureza', 'grupo', 'categoria', 'meio', 'status', 'parcela', 'valor']];
  const E = engine();

    if (it.status === 'pulado') continue;
    rows.push([m, it.data, titNome(it.titular), it.tipo, it.descricao, it.fornecedor || '', natNome(it.natureza) || '', grpById(catById(it.categoria)?.grupo)?.nome || '', catNome(it.categoria), meioNome(it.meio), it.virtual ? 'previsto (recorrência)' : it.status, it.parcela ? `${it.parcela.n}/${it.parcela.total}` : '', String(it.valor).replace('.', ',')]);
  }

  try { await S.downloads.save({filename: `lancamentos-${HOJE}.csv`, data: csv}); toast('Arquivo exportado.'); }
